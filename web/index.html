<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chitthi</title>
<!-- Pico CSS 2.1.1 (MIT), vendored so the app stays offline. Light theme only. -->
<link rel="stylesheet" href="/static/vendor/pico.red.min.css">
<style>
  :root {
    --deva: "Kohinoor Devanagari", "Noto Sans Devanagari", "Mangal", sans-serif;
    --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Geeza Pro", serif;
    --ok: var(--pico-ins-color);
    --bad: var(--pico-del-color);
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  [lang="hi"] { font-family: var(--deva); }
  [lang="ur"] { font-family: var(--urdu); line-height: 2.1; }
  body > header, body > main, body > footer { max-width: 920px; }

  /* Header */
  .brand { display: flex; align-items: baseline; gap: .5rem; font-weight: 700; font-size: 1.15rem; color: var(--pico-h1-color); }
  .brand span { font-family: var(--deva); color: var(--pico-primary); font-weight: 600; }
  .status { font-size: .8rem; color: var(--pico-muted-color); display: inline-flex; align-items: center; gap: .45rem; }
  .status .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); }
  .status .dot.off { background: var(--bad); }

  /* Hero */
  .hero { margin: 1.5rem 0 2rem; }
  .hero h1 { font-size: clamp(2rem, 4.6vw, 2.9rem); line-height: 1.12; letter-spacing: -.02em; margin-bottom: .6rem; }
  .hero h1 em { font-style: normal; color: var(--pico-primary); }
  .hero p { color: var(--pico-muted-color); font-size: 1.08rem; max-width: 38rem; }

  /* Collections */
  .label { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--pico-muted-color); margin-bottom: .5rem; }
  .collections { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.5rem; }
  .col {
    display: grid; grid-template-columns: auto 1fr; column-gap: .75rem; align-items: center; text-align: left;
    width: auto; margin: 0; padding: .7rem 1.1rem .7rem .8rem;
    background: var(--pico-card-background-color);
    color: var(--pico-contrast); border: 1px solid var(--pico-muted-border-color); box-shadow: none;
  }
  .col:hover { border-color: var(--pico-primary-underline); }
  .col[aria-pressed="true"] { border-color: var(--pico-primary); box-shadow: 0 0 0 .2rem var(--pico-primary-focus); }
  .col .seal {
    grid-row: span 2; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--pico-primary); color: var(--pico-primary-inverse); font-weight: 700; font-size: .85rem;
  }
  .col b { font-size: 1rem; }
  .col small { color: var(--pico-muted-color); font-size: .78rem; }

  /* Ask form */
  form.ask { margin-bottom: 2rem; }
  form.ask textarea { min-height: 5.5rem; resize: vertical; margin-bottom: .75rem; font-size: 1.05rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
  .row [role="group"] { width: auto; margin: 0; }
  .row [role="group"] button { padding: .45rem .95rem; font-size: .9rem; }
  .row [role="group"] button:not([aria-current="true"]) {
    --pico-background-color: var(--pico-card-background-color); --pico-color: var(--pico-muted-color);
    --pico-border-color: var(--pico-form-element-border-color);
  }
  .row .spacer { flex: 1; }
  .row kbd { font-size: .7rem; }
  #go { width: auto; margin: 0; padding: .55rem 1.4rem; }

  /* Answer */
  #out:empty { display: none; }
  article.answer > header { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--pico-muted-color); }
  article.answer p { font-size: 1.12rem; line-height: 1.75; margin: 0; white-space: pre-line; }
  article.answer.seance p { font-family: Georgia, "Iowan Old Style", serif; font-style: italic; }
  article.answer.seance p[lang="hi"] { font-family: var(--deva); font-style: normal; }
  article.answer.seance { border-left: .25rem solid var(--pico-primary); }
  article.answer mark { padding: 0 .15em; border-radius: .2rem; }
  article.answer mark.bad { --pico-mark-background-color: rgba(197, 47, 33, .12); text-decoration: line-through wavy var(--bad); }
  article.answer > footer { display: flex; flex-wrap: wrap; gap: .5rem; }
  .badge { font-size: .8rem; font-weight: 600; padding: .2rem .65rem; border-radius: 1rem; }
  .badge.ok { color: var(--ok); background: rgba(28, 105, 84, .1); }
  .badge.bad { color: var(--bad); background: rgba(136, 56, 53, .1); }
  .cite {
    display: inline-grid; place-items: center; min-width: 1.35rem; height: 1.35rem; margin: 0 .1rem; padding: 0 .3rem;
    font: 600 .72rem/1 var(--pico-font-family-sans-serif); font-style: normal; vertical-align: .35em;
    border-radius: .7rem; border: 0; background: var(--pico-primary); color: var(--pico-primary-inverse); cursor: pointer;
  }
  .cite:hover { background: var(--pico-primary-hover); }
  article.silent { text-align: center; color: var(--pico-muted-color); }
  article.error { border-left: .25rem solid var(--bad); }

  /* Ink-in: words fade up one after another. */
  .w { opacity: 0; display: inline-block; animation: ink .5s var(--ease) forwards; animation-delay: calc(var(--i) * 16ms); }
  @keyframes ink { from { opacity: 0; translate: 0 .35em; filter: blur(2px); } to { opacity: 1; translate: 0 0; filter: none; } }

  /* Passages */
  .ph { display: flex; align-items: baseline; gap: .75rem; margin: 2.25rem 0 1rem; }
  .ph h2 { margin: 0; font-size: 1.35rem; }
  .ph span { color: var(--pico-muted-color); font-size: .85rem; }
  article.p { display: grid; grid-template-columns: 1fr auto; gap: 1.25rem; align-items: start;
    opacity: 0; animation: up .5s var(--ease) forwards; animation-delay: calc(var(--done, 0ms) + var(--i) * 70ms); }
  @keyframes up { from { opacity: 0; translate: 0 .75rem; } to { opacity: 1; translate: 0 0; } }
  article.p.uncited { --pico-card-background-color: var(--pico-card-sectioning-background-color); box-shadow: none; border: 1px solid var(--pico-muted-border-color); }
  article.p.hl { animation: hl 1.6s var(--ease); opacity: 1; }
  @keyframes hl { 0%, 40% { box-shadow: 0 0 0 .25rem var(--pico-primary-focus); } 100% { box-shadow: var(--pico-card-box-shadow); } }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .6rem; font-size: .8rem; color: var(--pico-muted-color); margin-bottom: .5rem; }
  .meta .n { display: inline-grid; place-items: center; min-width: 1.35rem; height: 1.35rem; border-radius: .7rem; background: var(--pico-primary); color: #fff; font-weight: 600; font-size: .72rem; }
  .meta .tl { color: var(--pico-color); font-weight: 600; }
  .meta .lang { border: 1px solid var(--pico-muted-border-color); border-radius: 1rem; padding: 0 .5rem; }
  .p .text { max-height: 9.5em; overflow: hidden; line-height: 1.65; white-space: pre-line;
    -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .p .text.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
  .more { width: auto; margin: .5rem 0 0; padding: .25rem .7rem; font-size: .8rem; }
  .scan { width: 6.5rem; margin: 0; padding: .3rem; background: #fff; border: 1px solid var(--pico-muted-border-color);
    box-shadow: var(--pico-box-shadow); transition: transform .2s var(--ease); }
  .scan:hover { transform: translateY(-2px) rotate(-1deg); }
  .scan img { display: block; width: 100%; }

  /* Scan zoom */
  dialog#zoom article { padding: .5rem; max-width: min(92vw, 760px); }
  dialog#zoom img { display: block; max-height: 86vh; width: auto; margin: auto; animation: pop .35s var(--ease); }
  @keyframes pop { from { opacity: 0; scale: .94; } to { opacity: 1; scale: 1; } }

  .empty { color: var(--pico-muted-color); }
  body > footer { font-size: .8rem; color: var(--pico-muted-color); display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }

  @media (max-width: 640px) {
    .row kbd { display: none; }
    article.p { grid-template-columns: 1fr; }
    .scan { width: 5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .w, article.p, dialog#zoom img { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<header class="container">
  <nav>
    <ul><li><span class="brand">Chitthi <span>चिट्ठी</span></span></li></ul>
    <ul><li><span class="status" id="status"><span class="dot"></span>connecting…</span></li></ul>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <h1 id="headline">Ask the letters. They <em>answer</em> in their own words.</h1>
    <p>Every quote is checked word-for-word against the scanned page it came from. Nothing leaves this machine.</p>
  </section>

  <div class="label">Whose letters</div>
  <div class="collections" id="cols"></div>

  <form class="ask" id="form">
    <label for="q" class="label">Your question</label>
    <textarea id="q" placeholder="What did they write about…" required></textarea>
    <div class="row">
      <div role="group" id="modes" aria-label="Voice">
        <button type="button" data-mode="archivist" aria-current="true">Archivist</button>
        <button type="button" data-mode="seance" aria-current="false">Séance</button>
      </div>
      <div role="group" id="langs" aria-label="Answer in">
        <button type="button" data-lang="en" aria-current="true">English</button>
        <button type="button" data-lang="hi" aria-current="false" lang="hi">हिन्दी</button>
        <button type="button" data-lang="ur" aria-current="false" lang="ur">اردو</button>
      </div>
      <span class="spacer"></span>
      <kbd>⌘ ↵</kbd>
      <button type="submit" id="go">Ask →</button>
    </div>
  </form>

  <div id="out" aria-live="polite"></div>
</main>

<footer class="container">
  <span>Gemma via Ollama, on this machine</span>
  <span>Citations point to the original scan</span>
</footer>

<dialog id="zoom"><article><img alt="Scanned page"></article></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const LANG = { en: "English", hi: "Hindi", ur: "Urdu" };
const SCRIPT_LANG = { deva: "hi", arab: "ur", latn: "en" };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = { collection: null, mode: "archivist", lang: "en", cols: [] };

// Pico styles a pressed button inside role="group" through aria-current.
function segment(group, key, onPick) {
  group.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", group).forEach(x => x.setAttribute("aria-current", x === b));
    onPick(b.dataset[key]);
  });
}
segment($("#modes"), "mode", m => { state.mode = m; placeholder(); });
segment($("#langs"), "lang", l => state.lang = l);

const initials = name => { const w = name.split(/\s+/).filter(Boolean); return (w[0][0] + (w.length > 1 ? w.at(-1)[0] : "")).toUpperCase(); };

async function init() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("#status").innerHTML = `<span class="dot"></span>${esc(h.chat_model)} · ${esc(h.embed_model)}${h.backend === "fake" ? " · fake" : ""}`;
  } catch { $("#status").innerHTML = `<span class="dot off"></span>server offline`; }
  try { state.cols = await (await fetch("/api/collections")).json(); } catch { state.cols = []; }
  if (!state.cols.length) {
    $("#out").innerHTML = `<article class="empty">No letters yet. Run <code>python scripts/fetch_archive.py</code> then <code>python -m chitthi.ingest sources sources.toml</code>.</article>`;
    return;
  }
  $("#cols").innerHTML = state.cols.map(c =>
    `<button type="button" class="col" data-slug="${esc(c.slug)}" aria-pressed="false">
       <span class="seal" aria-hidden="true">${esc(initials(c.name))}</span>
       <b>${esc(c.name)}</b>
       <small>${esc(c.years || "")}${c.years ? " · " : ""}${c.docs} doc${c.docs === 1 ? "" : "s"} · ${c.passages} passages</small></button>`).join("");
  pick(state.cols[0].slug);
}

function placeholder() {
  const c = state.cols.find(c => c.slug === state.collection);
  if (!c) return;
  $("#q").placeholder = state.mode === "seance" ? `Ask ${c.name} something…` : `What did ${c.name} write about…`;
}
function pick(slug) {
  state.collection = slug;
  $$(".col").forEach(b => b.setAttribute("aria-pressed", b.dataset.slug === slug));
  placeholder();
}

$("#cols").addEventListener("click", e => { const b = e.target.closest(".col"); if (b) pick(b.dataset.slug); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#form").requestSubmit(); });

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("#q").value.trim();
  if (!question || !state.collection) return;
  const c = state.cols.find(c => c.slug === state.collection);
  $("#go").setAttribute("aria-busy", "true");
  $("#go").disabled = true;
  $("#out").innerHTML = `<article aria-busy="true">${state.mode === "seance" ? `Calling on ${esc(c.name)}…` : "Reading the letters…"}</article>`;
  $("#out").scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ collection: state.collection, question, mode: state.mode, lang: state.lang }) });
    if (!r.ok) throw new Error(await r.text());
    render(await r.json(), c);
  } catch (err) {
    $("#out").innerHTML = `<article class="error"><header>Something went wrong</header><p>${esc(err.message)}</p><p>Is Ollama running?</p></article>`;
  } finally { $("#go").disabled = false; $("#go").removeAttribute("aria-busy"); }
});

// Wrap every word in a span so the answer appears word by word; returns when it finishes (ms).
function inkIn(root) {
  if (calm) return 0;
  let i = 0;
  const walk = node => {
    for (const n of [...node.childNodes]) {
      if (n.nodeType === 1) {
        if (n.classList.contains("cite")) { n.classList.add("w"); n.style.setProperty("--i", Math.min(i++, 110)); }
        else walk(n);
        continue;
      }
      if (n.nodeType !== 3) continue;
      const frag = document.createDocumentFragment();
      for (const part of n.textContent.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) { frag.append(part); continue; }
        const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--i", Math.min(i++, 110)); s.textContent = part; frag.append(s);
      }
      n.replaceWith(frag);
    }
  };
  walk(root);
  return Math.min(i, 110) * 16 + 500;
}

const citeChip = n => `<button type="button" class="cite" data-n="${n}" aria-label="Go to passage ${n}">${n}</button>`;

function render(a, c) {
  const who = state.mode === "seance" ? `✦ ${esc(c.name)}, in their own words` : "✎ The archivist";
  if (a.silent) {
    $("#out").innerHTML = `<article class="answer silent"><header>${who}</header><p>${esc(a.text)}</p></article>${passagesHtml(a, 0)}`;
    return;
  }
  let html = esc(a.text);
  for (const q of a.quotes) {
    const eq = esc(q.quote);
    html = html.split(eq).join(`<mark class="${q.verified ? "" : "bad"}" title="${q.verified ? "Found word-for-word in passage " + q.passage : "Not found in the letters"}">${eq}</mark>`);
  }
  // [3] and [1, 4] both become chips.
  html = html.replace(/\[(\d{1,2}(?:\s*,\s*\d{1,2})*)\]/g, (_, ns) => ns.split(/\s*,\s*/).map(citeChip).join(""));
  const ok = a.quotes.filter(q => q.verified).length, bad = a.quotes.length - ok;
  $("#out").innerHTML = `
    <article class="answer ${state.mode}">
      <header>${who}</header>
      <p lang="${state.lang}" dir="auto">${html}</p>
      ${a.quotes.length ? `<footer>
        <span class="badge ok">✓ ${ok} quote${ok === 1 ? "" : "s"} found word-for-word</span>
        ${bad ? `<span class="badge bad">⚠ ${bad} not found in the letters</span>` : ""}</footer>` : ""}
    </article>`;
  const done = inkIn($("#out .answer p"));
  $("#out").insertAdjacentHTML("beforeend", passagesHtml(a, done));
}

function passagesHtml(a, done) {
  if (!a.passages.length) return "";
  const cited = new Set(a.cited);
  return `<div class="ph"><h2>From the letters</h2><span>${a.passages.length} passage${a.passages.length === 1 ? "" : "s"}${cited.size ? ` · ${cited.size} cited` : ""}</span></div>
    ${a.passages.map((p, i) => {
      const lang = SCRIPT_LANG[p.script] || p.lang;
      return `<article class="p ${cited.size && !cited.has(p.n) ? "uncited" : ""}" id="p${p.n}" style="--i:${i};--done:${Math.min(done, 900)}ms">
        <div>
          <div class="meta"><span class="n">${p.n}</span><span class="tl">${esc(p.title)}</span><span>p. ${p.page}</span>
            ${p.year ? `<span>${esc(p.year)}</span>` : ""}<span class="lang">${LANG[lang] || esc(lang)}</span>
            ${p.source_url ? `<a href="${esc(p.source_url)}" target="_blank" rel="noopener">source ↗</a>` : ""}</div>
          <div class="text" lang="${esc(lang)}" dir="auto">${esc(p.text)}</div>
          <button type="button" class="more secondary outline" hidden>Read the whole passage</button>
        </div>
        ${p.image ? `<button type="button" class="scan" aria-label="Open scan of page ${p.page}"><img src="/pages/${esc(p.image)}" alt="Scan of page ${p.page}" loading="lazy"></button>` : ""}
      </article>`;
    }).join("")}`;
}

// Show "read more" only where the text is actually clipped.
new MutationObserver(() => requestAnimationFrame(() => $$(".p .text").forEach(t => {
  const more = t.nextElementSibling;
  if (more && !t.classList.contains("open")) more.hidden = t.scrollHeight <= t.clientHeight + 4;
}))).observe($("#out"), { childList: true });

$("#out").addEventListener("click", e => {
  const cite = e.target.closest(".cite");
  if (cite) {
    const el = $("#p" + cite.dataset.n);
    if (el) {
      el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "center" });
      el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl");
    }
    return;
  }
  const more = e.target.closest(".more");
  if (more) {
    const t = more.previousElementSibling, open = t.classList.toggle("open");
    more.textContent = open ? "Show less" : "Read the whole passage";
    return;
  }
  const scan = e.target.closest(".scan");
  if (scan) openScan($("img", scan));
});

function openScan(img) {
  const big = $("#zoom img");
  big.src = img.src; big.alt = img.alt;
  $("#zoom").showModal();
}
$("#zoom").addEventListener("click", () => $("#zoom").close());
init();
</script>
</body>
</html>
